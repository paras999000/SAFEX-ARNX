version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: safex_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: safex_safety_db
    ports:
      - "5432:5432"
    volumes:
      - safex_pgdata:/var/lib/postgresql/data

volumes:
  safex_pgdata:
